<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Link WhatsApp - Linkzap</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #f0f2f5; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h1 { color: #128C7E; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #444; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 90px; }
        button { background: #25D366; color: white; border: none; padding: 14px; border-radius: 6px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background: #128C7E; }
        .result-box { margin-top: 25px; background: #eef9f1; padding: 15px; border-radius: 8px; border: 1px solid #c8e6c9; display: none; text-align: left; }
        .result-box input { background: white; margin-top: 5px; font-family: monospace; font-size: 12px; color: #333; }
        .btn-copy { background: #128C7E; margin-top: 8px; padding: 8px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Gerador de Link WhatsApp</h1>
        <p>Crie seu link personalizado com mensagem pronta para o Linkzap</p>

        <div class="form-group">
            <label for="whatsappNumber">Número do WhatsApp (com DDD):</label>
            <input type="text" id="whatsappNumber" placeholder="Ex: 5511999999999">
        </div>

        <div class="form-group">
            <label for="whatsappMessage">Mensagem Personalizada:</label>
            <textarea id="whatsappMessage" placeholder="Olá! Gostaria de saber mais sobre os produtos."></textarea>
        </div>

        <button onclick="gerarLink()">Gerar Link</button>

        <div class="result-box" id="resultBox">
            <label style="color: #2e7d32;">Seu link gerado:</label>
            <input type="text" id="generatedLink" readonly>
            <button class="btn-copy" onclick="copiarLink()">Copiar Link</button>
        </div>
    </div>

    <script>
        function gerarLink() {
            let numero = document.getElementById('whatsappNumber').value.replace(/\D/g, '');
            let mensagem = document.getElementById('whatsappMessage').value;

            if (!numero) {
                alert('Por favor, informe o número do WhatsApp!');
                return;
            }

            let linkCodificado = `https://api.whatsapp.com/send?phone=${numero}&text=${encodeURIComponent(mensagem)}`;
            
            document.getElementById('generatedLink').value = linkCodificado;
            document.getElementById('resultBox').style.display = 'block';
        }

        function copiarLink() {
            let campoLink = document.getElementById('generatedLink');
            campoLink.select();
            campoLink.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(campoLink.value);
            alert('Link copiado com sucesso!');
        }
    </script>
</body>
</html>
