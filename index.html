<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Vitrine de Afiliado</title>
    <!-- Importando a biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #f0f2f5; color: #333; text-align: center; }
        .banner-container { width: 100%; max-height: 400px; overflow: hidden; background: #ddd; }
        .banner-container img { width: 100%; height: auto; object-fit: cover; max-height: 400px; }
        .content { padding: 40px 20px; }
        .counter-box { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 20px; }
        h1 { color: #128C7E; }
    </style>
</head>
<body>

    <!-- Banner atualizado dinamicamente pelo admin -->
    <div class="banner-container">
        <img id="bannerImage" src="https://via.placeholder.com/1200x400?text=Carregando+Banner..." alt="Banner Principal">
    </div>

    <div class="content">
        <h1>Bem-vindo à minha Página!</h1>
        <p>Confira os melhores produtos e ofertas exclusivas.</p>

        <!-- Contador de usuários atualizado dinamicamente pelo admin -->
        <div class="counter-box">
            <h3>👥 Usuários Ativos / Conectados</h3>
            <p style="font-size: 24px; font-weight: bold; color: #25D366;" id="userCounter">Carregando...</p>
        </div>
    </div>

    <script>
        // Configurações do seu projeto no Supabase
        const SUPABASE_URL = 'https://cbsmepluubphgyzvkphi.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_emnMTLRXvWUFPNKDkIYmwQ_QtOi6TIb';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function carregarDadosSite() {
            try {
                let { data, error } = await _supabase
                    .from('configuracoes')
                    .select('*')
                    .eq('id', 1)
                    .single();

                if (data) {
                    document.getElementById('bannerImage').src = data.banner_url;
                    document.getElementById('userCounter').innerText = data.contador_usuarios;
                }
            } catch (err) {
                console.error('Erro ao carregar dados:', err);
            }
        }

        carregarDadosSite();
    </script>
</body>
</html>
