<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Alterar Banner e Métricas</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .admin-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #128C7E; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #25D366; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #128C7E; }
        .msg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>Painel Admin</h2>
        
        <div class="form-group">
            <label for="bannerInput">URL da Imagem do Banner:</label>
            <input type="text" id="bannerInput" placeholder="Cole o link da nova imagem aqui">
        </div>

        <div class="form-group">
            <label for="counterInput">Contagem de Usuários (Fictícia ou Real):</label>
            <input type="number" id="counterInput" placeholder="Ex: 1542">
        </div>

        <button onclick="salvarAlteracoes()">Salvar Alterações</button>
        <div class="msg" id="msgStatus"></div>
    </div>

    <script>
        const SUPABASE_URL = 'SUA_URL_DO_SUPABASE';
        const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_DO_SUPABASE';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Carrega os valores atuais quando abre o painel
        async function carregarAdmin() {
            let { data } = await _supabase.from('configuracoes').select('*').eq('id', 1).single();
            if (data) {
                document.getElementById('bannerInput').value = data.banner_url;
                document.getElementById('counterInput').value = data.contador_usuarios;
            }
        }

        async function salvarAlteracoes() {
            let novoBanner = document.getElementById('bannerInput').value;
            let novoContador = parseInt(document.getElementById('counterInput').value);

            let { error } = await _supabase
                .from('configuracoes')
                .update({ banner_url: novoBanner, contador_usuarios: novoContador })
                .eq('id', 1);

            let msg = document.getElementById('msgStatus');
            if (error) {
                msg.style.color = 'red';
                msg.innerText = 'Erro ao salvar!';
            } else {
                msg.style.color = 'green';
                msg.innerText = 'Alterações salvas com sucesso! O site já foi atualizado.';
            }
        }

        carregarAdmin();
    </script>
</body>
</html>
